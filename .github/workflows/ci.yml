name: CI

on:
  push:
    branches: [main]
  pull_request:

# A push that lands while the one before it is still running makes that one moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Both platforms are reported, rather than the second being cancelled by the
      # first: which of them broke is the thing worth knowing.
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@v4
      # No toolchain is named here. rustup reads rust-toolchain.toml and installs what
      # it says, so CI and a working copy cannot be checking different Rusts.
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
