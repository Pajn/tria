[package]
name = "tria"
version = "0.1.0"
edition = "2024"
description = "A terminal chat client for T3 Code"
license = "MIT"
repository = "https://github.com/Pajn/tria"
readme = "README.md"
keywords = ["tui", "terminal", "chat", "ratatui", "t3code"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "6"
flate2 = "1"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["gif", "ico", "jpeg", "png", "webp"] }
libc = "0.2"
open = "5"
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
toml = "0.9"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tui-markdown = "0.3"
url = "2"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
vt100 = "0.16"
lucide-icons = { version = "1.47.0", default-features = false }
fontdue = "0.9.4"
